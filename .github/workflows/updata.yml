name: ISYZAN Auto-Update Subscription

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download Happ subscription
        run: |
          curl -s https://solovyov-jenya2004.vercel.app/random/ > isyzan_happ.txt
          echo "✅ Happ подписка скачана"

      - name: Download Incy subscription
        run: |
          curl -s https://solovyov-jenya2004.vercel.app/final_sorted/ > isyzan_incy.txt
          echo "✅ Incy подписка скачана"

      - name: Upload Happ config
        uses: actions/upload-artifact@v4
        with:
          name: isyzan-happ
          path: isyzan_happ.txt

      - name: Upload Incy config
        uses: actions/upload-artifact@v4
        with:
          name: isyzan-incy
          path: isyzan_incy.txt

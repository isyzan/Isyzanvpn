name: ISYZAN Incy Auto-Update (с проверкой)

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch:

jobs:
  update-incy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run filter
        run: python filter.py

      - name: Upload Incy config (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: isyzan-incy
          path: isyzan_incy.txt

      - name: Commit and push if changed
        run: |
          git config user.name "ISYZAN Bot"
          git config user.email "bot@isyzan.local"
          git add isyzan_incy.txt
          git diff --staged --quiet || git commit -m "Auto-update Incy $(date +'%Y-%m-%d %H:%M')"
          git push

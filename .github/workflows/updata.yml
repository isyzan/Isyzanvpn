name: ISYZAN Incy Auto-Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-incy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Incy subscription
        run: |
          curl -s https://solovyov-jenya2004.vercel.app/final_sorted/ > isyzan_incy.txt
          echo "✅ Incy подписка скачана"

      - name: Commit and push if changed
        run: |
          git config user.name "ISYZAN Bot"
          git config user.email "bot@isyzan.local"
          git add isyzan_incy.txt
          git diff --staged --quiet || git commit -m "Auto-update Incy $(date +'%Y-%m-%d %H:%M')"
          git push

name: ISYZAN Incy Auto-Update (с проверкой)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-incy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run filter
        run: python filter.py

      - name: Upload Incy config
        uses: actions/upload-artifact@v4
        with:
          name: isyzan-incy
          path: isyzan_incy.txt

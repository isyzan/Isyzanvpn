name: ISYZAN Incy Auto-Update (100-150 servers)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-incy:
    runs-on: ubuntu-latest
    steps:
      - name: Download and trim Incy subscription
        run: |
          # Скачиваем полный список
          curl -s https://solovyov-jenya2004.vercel.app/final_sorted/ > full_list.txt
          
          # Берём только первые 150 строк (или меньше, если их меньше)
          head -150 full_list.txt > isyzan_incy.txt
          
          # Показываем количество строк
          echo "✅ Всего строк в подписке: $(wc -l < isyzan_incy.txt)"
          echo "✅ Первые 5 строк:"
          head -5 isyzan_incy.txt

      - name: Upload Incy config
        uses: actions/upload-artifact@v4
        with:
          name: isyzan-incy
          path: isyzan_incy.txt
